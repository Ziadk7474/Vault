 ${p?`<label for="fstat">Plan status</label><select id="fstat">${['active','paused','completed','archived'].map(x=>`<option ${o.status==x?'selected':''}>${x}</option>`).join('')}</select>`:`<label for="fpaid">Installments already paid before using DueVault</label><input id="fpaid" type="number" min="0" value="0" oninput="prev()"><div class="sub" style="margin-top:4px">Counted from the first installment. Past installments you leave out stay as Overdue until you confirm them in the review step.</div>`}

function prev(){const g=x=>$('#'+x)?$('#'+x).value:'',a=+g('famt'),d=+g('fdur')*(g('funit')=='years'?12:1),s=g('fstart'),pb=+g('fpaid')||0,e=$('#prev');if(!e)return;
 if(!(a>0&&d>=1&&s)){e.innerHTML='<span class="sub">Fill amount, start date and duration to see the schedule.</span>';return}

function saveForm(){const g=x=>$('#'+x)?$('#'+x).value.trim():'',p=item(editId),a=+g('famt'),months=Math.floor(+g('fdur')*(g('funit')=='years'?12:1)),start=p&&Object.keys(p.rec).length?p.start:g('fstart');
 if(!g('fname'))return toast('Enter a name or purpose',1);if(!(a>0))return toast('Monthly amount must be greater than zero',1);if(!start)return toast('Choose a start date',1);if(!(months>=1&&months<=600))return toast('Duration must be between 1 and 600 months',1);

function savePay(id,i,k){const p=item(id),r={...(p.rec[i]||{})},g=x=>$('#'+x).value.trim(),h={...(r.h||{})},ts=Date.now();
 if(k=='paid'){const a=+g('ma');if(!(a>0))return toast('Enter a valid amount',1);if(r.amt==null)r.amt=p.amt;r.paid=(+r.paid||0)+a;r.d=g('md')||TODAY();r.m=g('mm');r.r=g('mr');r.n=g('mn');delete r.s;h[ts]=`Payment ${cfmt(a,p.cur)} recorded`+(r.paid<r.amt?' (partial)':'')}
 else if(k=='rejected'){if(r.amt==null)r.amt=p.amt;r.s='rejected';r.d=g('md')||TODAY();r.why=g('mw');h[ts]='Marked rejected'+(r.why?': '+r.why:'')}

 <div class="rvl">${L.map(i=>`<label class="ck"><input type="checkbox" class="rv" value="${i}">#${i+1} · ${fd(due(p,i))} · ${cfmt(p.amt,p.cur)}</label>`).join('')}</div>
